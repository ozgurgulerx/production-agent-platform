[project]
name = "r1-functions-to-mcp-tools"
version = "0.1.0"
description = "Expose learner-written functions as read-only MCP tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ['mcp>=2,<3', 'pydantic>=2.14.1']

[dependency-groups]
dev = ['pytest>=9.1.1', 'pytest-cov>=6', 'ruff>=0.17', 'pytest-asyncio>=1.4']

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
