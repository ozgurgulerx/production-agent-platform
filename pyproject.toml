[project]
name = "production-agent-platform"
version = "0.1.0"
description = "Support-operations agent for regulated financial services on Azure AI Foundry"
readme = "README.md"
authors = [{ name = "Ozgur Guler", email = "ozgur.guler1@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2,<3",
    "pydantic>=2.14.1",
]

[dependency-groups]
dev = [
    "mypy>=1.20",
    "pre-commit>=4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pap"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["R0-tickets-basics", "R1-tickets-mcp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
mypy_path = "src"
files = ["src"]
