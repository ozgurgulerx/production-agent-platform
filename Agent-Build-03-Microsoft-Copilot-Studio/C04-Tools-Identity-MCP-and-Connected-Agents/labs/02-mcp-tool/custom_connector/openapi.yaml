# Custom connector definition for the ticket MCP server (OpenAPI 2.0, as Power Platform requires).
# The single extension below is what makes Copilot Studio treat the connector as an MCP server (reading map D3).
# Import in Power Apps > Custom connectors > New > Import an OpenAPI file, or `paconn create`.
swagger: "2.0"
info:
  title: Ticket MCP server
  description: Streamable HTTP MCP endpoint for the UK support-ticket tools (get_ticket, list_tickets, get_policy, issue_refund).
  version: "1.0"
host: ticket-mcp.<region>.azurecontainerapps.io      # replace with your Container Apps FQDN (TICKET_MCP_URL host)
basePath: /
schemes: [https]
consumes: [application/json]
produces: [application/json]
paths:
  /mcp:
    post:
      summary: Ticket MCP server
      x-ms-agentic-protocol: mcp-streamable-1.0        # the one line that matters
      operationId: InvokeMCP
      responses:
        "200":
          description: Success
          schema:
            type: object
securityDefinitions:
  # Pick ONE block per connector version. API key: the user supplies the key at run time (D3).
  api_key:
    type: apiKey
    in: header
    name: X-API-Key
  # OAuth 2.0 manual mode: client id/secret live in the connector, tokens in each user's connection.
  oauth2_auth:
    type: oauth2
    flow: accessCode
    authorizationUrl: https://login.microsoftonline.com/<tenant-id>/oauth2/v2.0/authorize
    tokenUrl: https://login.microsoftonline.com/<tenant-id>/oauth2/v2.0/token
    scopes:
      api://<mcp-server-app-id>/Tickets.ReadWrite: call the ticket tools as the signed-in user
security:
  - api_key: []
