name: stage-checks

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  stages:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stage: [S03-AI-Agents-Tools-and-MCP/S03.01-Python-Functions, S03-AI-Agents-Tools-and-MCP/S03.02-Functions-to-MCP-Tools]
    defaults:
      run:
        working-directory: ${{ matrix.stage }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: '${{ matrix.stage }}/uv.lock'
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Compile scaffold and validate fixtures
        run: |
          uv run python -m compileall -q src
          uv run python - <<'PY'
          import json
          from pathlib import Path

          for path in sorted(Path("data").glob("*.json")):
              records = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(records, list) or any(
                  not isinstance(record, dict) for record in records
              ):
                  raise ValueError(f"{path}: expected a JSON list of objects")
              print(f"Validated {path}")
          PY
      - name: Collect and run learner tests
        shell: bash
        run: |
          set +e
          uv run pytest --collect-only -q
          collection_status=$?
          set -e
          if [ "$collection_status" -eq 5 ]; then
            echo 'scaffold only—functionality unverified'
          elif [ "$collection_status" -ne 0 ]; then
            exit "$collection_status"
          else
            uv run pytest --cov=src --cov-report=term-missing --cov-fail-under=80
          fi
