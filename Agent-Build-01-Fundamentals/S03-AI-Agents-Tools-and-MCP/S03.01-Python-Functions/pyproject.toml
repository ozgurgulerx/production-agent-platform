[project]
name = "s03-01-python-functions"
version = "0.1.0"
description = "Python recap through ticket and policy functions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ['pytest>=9.1.1', 'pytest-cov>=6', 'ruff>=0.17']

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
