[project]
name = "stage3a-mcp"
version = "0.1.0"
description = "Stage 3a — support-tickets MCP server (3 read-only tools over tickets + policies)"
readme = "README.md"
authors = [
    { name = "Ozgur Guler", email = "ozgur.guler1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2,<3",
    "pydantic>=2.14.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
