[project]
name = "s03-mcp-oauth"
version = "0.1.0"
description = "Local MCP authorization and simulated refund learning stage"
requires-python = ">=3.12"
dependencies = ["mcp==1.26.0", "PyJWT[crypto]==2.15.1"]

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1,<2", "coverage>=7,<8"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
asyncio_mode = "auto"
testpaths = ["tests"]
