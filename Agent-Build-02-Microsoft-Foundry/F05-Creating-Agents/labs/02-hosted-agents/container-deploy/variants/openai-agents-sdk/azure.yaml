# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
# Way 5: hosted agent from a source zip. azd zips src/, Foundry builds the image (remote build).
# All agent configuration lives here. There is no agent.yaml any more.
requiredVersions:
  azd: '>=1.34.2'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.18'
name: ticket-agent-openai-agents
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5-mini
        model:
          format: OpenAI
          name: gpt-5-mini
          version: '2025-08-07'
        sku:
          name: GlobalStandard
          capacity: 10
  ticket-agent-openai-agents:
    host: azure.ai.agent
    metadata:
      tags: [OpenAI Agents SDK, Responses Protocol, Code Deploy]
    project: src/ticket-agent-openai-agents
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    uses:
      - ai-project
    kind: hosted
    name: ticket-agent-openai-agents
    description: Support-ticket agent (OpenAI Agents SDK) hosted by Foundry, deployed from source.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      PYTHONNOUSERSITE: "1"
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
infra:
  provider: microsoft.foundry
