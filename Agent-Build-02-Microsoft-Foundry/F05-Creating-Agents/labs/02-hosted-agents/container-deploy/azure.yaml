# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
# Way 6: hosted agent from a container image you define. `docker.remoteBuild: true` builds in ACR
# (no local Docker); set it to false to build locally (must be linux/amd64).
requiredVersions:
  azd: '>=1.34.2'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.18'
name: ticket-agent-hosted
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5-mini
        model:
          format: OpenAI
          name: gpt-5-mini
          version: '2025-08-07'
        sku:
          name: GlobalStandard
          capacity: 10
  ticket-agent-hosted:
    host: azure.ai.agent
    metadata:
      tags: [Agent Framework, Responses Protocol, Container Deploy]
    project: src/ticket-agent-hosted
    language: python
    docker:
      path: Dockerfile
      remoteBuild: true
    uses:
      - ai-project
    kind: hosted
    name: ticket-agent-hosted
    description: Support-ticket agent (Agent Framework) hosted by Foundry from a container image.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      PYTHONNOUSERSITE: "1"
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
    container:
      resources:
        cpu: '1'
        memory: 2Gi
infra:
  provider: microsoft.foundry
